# Rails 7.1 on MySQL (mysql2), Puma single mode.
x-app: &app
  image: ruby:3.3
  working_dir: /app
  volumes:
    - .:/app
    - ../..:/gem:ro
    - bundle:/usr/local/bundle
  environment:
    RAILS_ENV: production
    SECRET_KEY_BASE: e2e-not-secret-e2e-not-secret-e2e-not-secret-e2e-not-secret
    DATABASE_URL: mysql2://root:root@db:3306/shop
    ZHARP_KEY: ${ZHARP_KEY}
    ZHARP_ENDPOINT: ${ZHARP_ENDPOINT:-http://host.docker.internal:3000/api/v1/otlp}
    ZHARP_SERVICE: e2e-rails71
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  db:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: shop }
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-proot"], interval: 3s, retries: 40 }
  setup:
    <<: *app
    depends_on: { db: { condition: service_healthy } }
    command: sh -c 'gem install -N bundler -v "~> 4.0" >/dev/null && bundle install --quiet && bin/rails db:prepare'
  web:
    <<: *app
    depends_on: { setup: { condition: service_completed_successfully } }
    command: bundle exec puma -C config/puma.rb
    ports: ["3171:3000"]

volumes:
  bundle:
