# semantic_logger with ZHARP_LOGS=true, Ruby 4.0.
services:
  script:
    image: ruby:4.0
    working_dir: /app
    volumes: [".:/app", "../..:/gem:ro", "bundle:/usr/local/bundle"]
    environment:
      ZHARP_KEY: ${ZHARP_KEY}
      ZHARP_LOGS: "true"
      ZHARP_ENDPOINT: ${ZHARP_ENDPOINT:-http://host.docker.internal:3000/api/v1/otlp}
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: sh -c 'bundle install --quiet && ruby worker.rb'
volumes:
  bundle:
