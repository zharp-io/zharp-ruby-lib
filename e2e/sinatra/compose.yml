# Sinatra under Unicorn (2 workers, preload_app), Ruby 3.4. (Unicorn 6.1 segfaults in its accept loop on
# Ruby 4.0, with or without Zharp.)
services:
  web:
    image: ruby:3.4
    working_dir: /app
    volumes: [".:/app", "../..:/gem:ro", "bundle:/usr/local/bundle"]
    environment:
      ZHARP_KEY: ${ZHARP_KEY}
      ZHARP_ENDPOINT: ${ZHARP_ENDPOINT:-http://host.docker.internal:3000/api/v1/otlp}
      ZHARP_SERVICE: e2e-sinatra
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: sh -c 'gem install -N bundler -v "~> 4.0" >/dev/null && bundle install --quiet && bundle exec unicorn -c unicorn.rb config.ru'
    ports: ["3191:3000"]
    healthcheck: { test: ["CMD", "ruby", "-rnet/http", "-e", "Net::HTTP.get(URI('http://127.0.0.1:3000/carts/1'))"], interval: 3s, retries: 100, start_period: 900s }
volumes:
  bundle:
    external: true
    name: zharp-e2e-bundle-rb34
