# Sinatra under Unicorn (2 workers, preload_app), Ruby 4.0.
services:
  web:
    image: ruby:4.0
    working_dir: /app
    volumes: [".:/app", "../..:/gem:ro", "bundle:/usr/local/bundle"]
    environment:
      ZHARP_KEY: ${ZHARP_KEY}
      ZHARP_ENDPOINT: ${ZHARP_ENDPOINT:-http://host.docker.internal:3000/api/v1/otlp}
      ZHARP_SERVICE: e2e-sinatra
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: sh -c 'bundle install --quiet && bundle exec unicorn -c unicorn.rb config.ru'
    ports: ["3191:3000"]
    healthcheck: { test: ["CMD", "ruby", "-rnet/http", "-e", "Net::HTTP.get(URI('http://127.0.0.1:3000/carts/1'))"], interval: 3s, retries: 100 }
volumes:
  bundle:
